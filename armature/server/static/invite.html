<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="armature-base" content="">
<title>Armature invite</title>
<link rel="icon" href="data:,">
<script src="static/theme.js"></script>
<link rel="stylesheet" href="static/style.css">
<script type="module" src="static/invite.js"></script>
</head>
<body>
<main class="login-wrap">
  <h1>Armature</h1>
  <p class="sub" id="intro">Checking your invite…</p>
  <form id="invite" hidden novalidate>
    <p id="who"></p>
    <label>New password <input id="password" name="password" type="password" autocomplete="new-password" minlength="12" required></label>
    <label>New password again <input id="password-again" name="password-again" type="password" autocomplete="new-password" minlength="12" required></label>
    <div id="enroll" hidden>
      <p>Add this account to an authenticator app, then enter the code it shows.</p>
      <p class="mono wrap-anywhere" id="otpauth"></p>
      <p>Or type the secret: <span class="mono wrap-anywhere" id="secret"></span></p>
      <label>Authenticator code <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
    </div>
    <button type="submit">Set password and sign in</button>
  </form>
  <div class="err" id="err" role="alert" aria-live="assertive"></div>
  <div class="appearance" data-theme-toggle></div>
</main>
</body>
</html>
