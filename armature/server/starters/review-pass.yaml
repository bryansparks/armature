              line: {type: integer, minimum: 1}
              severity: {enum: [high, medium, low]}
              blocking: {type: boolean}
              claim: {type: string}
              body: {type: string}
              suggestion: {type: string}
    depends_on: [risk, jira]

  # The lead checks each finding in the code and decides what blocks the merge.
  - id: team_lead
    skip_if: "{{ marked.valid }}"
    agent:
      model: review
      role: team_lead
      prompt: |
        Lead the review of pull request #{{ number }} of {{ slug }}, checked out here. The specialists' reviews are
        in reviews.md by role, and a skipped specialist didn't run. Check each finding in the code, then decide it:
        block, suggest, or drop, with a one-line reason. Approve only when nothing blocks.
      context_files:
        reviews: >-
          {{ {'simplicity': simplicity, 'correctness': correctness, 'security': security, 'performance': performance,
          'beauty': beauty, 'test_adequacy': test_adequacy, 'concurrency': concurrency, 'conventions': conventions,
          'compatibility': compatibility} | tojson(indent=2) }}
        verify.json: '{"ran": false, "reason": "This workflow has no build step, so nothing was built or linted."}'
        pr: "{{ context.pr }}"
        files.json: "{{ context.files | default([]) | tojson }}"
        findings: "{{ context.findings }}"
        discussion: "{{ context.discussion }}"
        jira: "{{ jira | tojson if jira.found else 'No Jira issue: the title and branch name none, or it could not be read.' }}"
    output_mode: guided_json
    output_schema:
      type: object
      required: [verdict, summary, decisions, comments]
      properties:
        verdict: {enum: [approve, comment]}
        summary: {type: string}
        decisions:
          type: array
          items:
            type: object
            required: [claim, path, raised_by, decision, reason]
            properties:
              claim: {type: string}
              raised_by: {type: array, items: {type: string}}
              decision: {enum: [block, suggest, drop]}
              reason: {type: string}
              finding_id: {type: string}
              path: {type: string}
              line: {type: integer, minimum: 1}
              disposition: {enum: [keep, drop_rebutted, resolved]}
        comments:
          type: array
          items:
            type: object
            required: [path, line, severity, blocking, body, claim]
            properties:
              claim: {type: string}
              raised_by: {type: array, items: {type: string}}
              finding_id: {type: string}
              path: {type: string}
              line: {type: integer, minimum: 1}
              severity: {enum: [high, medium, low]}
              blocking: {type: boolean}
              body: {type: string}
              suggestion: {type: string}
              fix: {type: string}
    depends_on: [simplicity, correctness, security, performance, beauty, test_adequacy, concurrency, conventions, compatibility]

  # The server records each decision as a finding of this step, with its reason.
  - id: decisions
    skip_if: "{{ marked.valid }}"
    adapter: review/decisions
    fail_as_value: true
    with:
      repo: "{{ slug }}"
      number: "{{ number }}"
      decisions: "{{ team_lead.decisions }}"
    depends_on: [team_lead]

  - id: post
    skip_if: "{{ marked.valid }}"
    adapter: github/post-review
    with:
      repo: "{{ slug }}"
      number: "{{ number }}"
      head: "{{ risk.head }}"
      verdict: "{{ team_lead.verdict }}"
      summary: "{{ team_lead.summary }}"
      comments: "{{ team_lead.comments }}"
      decisions: "{{ team_lead.decisions }}"
    depends_on: [team_lead]

  # The server marks only a head whose review this run posted as an approval.
  - id: mark
    skip_if: "{{ marked.valid or team_lead.verdict != 'approve' }}"
    adapter: review/mark
    with:
      repo: "{{ slug }}"
      number: "{{ number }}"
    depends_on: [post]
