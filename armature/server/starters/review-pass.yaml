name: review-pass
version: "1.0"
description: "One review of a pull request's head: risk, a specialist panel, the team lead's decisions, the posted review, and the reviewed mark."

contracts:
  inputs:
    - {name: repo, type: string, required: true}    # the repository's https URL, which agent sessions clone
    - {name: slug, type: string, required: true}    # owner/name, for the GitHub tools
    - {name: number, type: integer, required: true}
    - {name: ref, type: string, required: true}     # the commit or ref the sessions review
    - {name: round, type: integer, default: 1}
  outputs:
    - {name: marked, type: boolean, from: "{{ marked.valid }}"}
    - {name: risk, type: string, from: "{{ risk.level }}"}
    - {name: head, type: string, from: "{{ risk.head or marked.head }}"}
    - {name: verdict, type: string, from: "{{ team_lead.verdict }}"}
    - {name: comments, type: array, from: "{{ team_lead.comments }}"}
  max_llm_calls: 20
  timeout_hours: 2

stages:
  # A head that already carries a valid mark ends the run as a no-op.
  - id: marked
    adapter: review/marked
    with:
      repo: "{{ slug }}"
      number: "{{ number }}"
    depends_on: []

  # What the sessions read as files: the pull request, its changed lines, its discussion, Armature's findings, and
  # the first Jira issue its title or branch names.
  - id: context
    skip_if: "{{ marked.valid }}"
    adapter: review/context
    fail_as_value: true
    with:
      repo: "{{ slug }}"
      number: "{{ number }}"
    depends_on: [marked]

  - id: jira
    skip_if: "{{ marked.valid or not context.jira_keys }}"
    adapter: jira/get-issue
    fail_as_value: true
    with:
      issue: "{{ context.jira_keys[0] }}"
    depends_on: [context]

  - id: rate
    skip_if: "{{ marked.valid }}"
    agent:
      model: review
      prompt: |
        Rate the risk of merging pull request #{{ number }} of {{ slug }}, checked out here, with the risk-rubric
        skill. The diff is against the pull request's base branch.
      skills: [risk-rubric]
    output_mode: guided_json
    output_schema:
      type: object
      required: [level, reasons]
      properties:
        level: {enum: [low, medium, high]}
        reasons: {type: array, items: {type: string}}
    depends_on: [marked]

  # The server raises the level to its path floors and picks the panel from it.
  - id: risk
    skip_if: "{{ marked.valid }}"
    adapter: review/risk
    with:
      repo: "{{ slug }}"
      number: "{{ number }}"
      level: "{{ rate.level }}"
      reasons: "{{ rate.reasons }}"
      expect_head: "{{ rate.commit }}"
    depends_on: [rate]

  # The panel: every specialist runs in parallel, each with its role document as instructions. Low risk runs only
  # the low-risk panel, so the others skip.
  - id: simplicity
    skip_if: "{{ marked.valid or 'simplicity' not in risk.panel }}"
    fail_as_value: true
    agent:
      model: review
      role: simplicity
      prompt: |
        Review pull request #{{ number }} of {{ slug }}, checked out here. Report only findings in lines the pull
        request changes. pr.md holds its title, branch, and description, files.json every changed file with the
        new-file line ranges a comment can land on, and jira.md its Jira issue.
      context_files:
        pr: "{{ context.pr }}"
        files.json: "{{ context.files | default([]) | tojson }}"
        jira: "{{ jira | tojson if jira.found else 'No Jira issue: the title and branch name none, or it could not be read.' }}"
    output_mode: guided_json
    output_schema:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items:
            type: object
            required: [path, line, severity, blocking, claim, body]
            properties:
              path: {type: string}
              line: {type: integer, minimum: 1}
              severity: {enum: [high, medium, low]}
              blocking: {type: boolean}
              claim: {type: string}
              body: {type: string}
              suggestion: {type: string}
    depends_on: [risk, jira]

  - id: correctness
    skip_if: "{{ marked.valid or 'correctness' not in risk.panel }}"
    fail_as_value: true
    agent:
      model: review
