        jira: "{{ jira | tojson if jira.found else 'No Jira issue: the title and branch name none, or it could not be read.' }}"
    output_mode: guided_json
    output_schema:
      type: object
      required: [findings]
      properties:
        findings:
          type: array
          items:
            type: object
            required: [path, line, severity, blocking, claim, body]
            properties:
              path: {type: string}
              line: {type: integer, minimum: 1}
              severity: {enum: [high, medium, low]}
              blocking: {type: boolean}
              claim: {type: string}
              body: {type: string}
              suggestion: {type: string}
    depends_on: [risk, jira]

  - id: beauty
    skip_if: "{{ marked.valid or 'beauty' not in risk.panel }}"
    fail_as_value: true
    agent:
      model: review
      role: beauty
      prompt: |
        Review pull request #{{ number }} of {{ slug }}, checked out here. Report only findings in lines the pull
        request changes. pr.md holds its title, branch, and description, files.json every changed file with the
        new-file line ranges a comment can land on, and jira.md its Jira issue.
      context_files:
        pr: "{{ context.pr }}"
        files.json: "{{ context.files | default([]) | tojson }}"
        jira: "{{ jira | tojson if jira.found else 'No Jira issue: the title and branch name none, or it could not be read.' }}"
    output_mode: guided_json
    output_schema:
