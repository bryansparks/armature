name: harness-optimizer
version: "1.0"
description: "Meta-Harness — reads execution traces and proposes workflow spec improvements"

model_tiers:
  frontier:
    provider: anthropic
    model: claude-opus-4-7

stages:
  - id: analyze_traces
    role:
      name: trace_analyst
      type: researcher
      model_tier: frontier
      description: |
        Analyze the execution traces and proposal history provided in the context.

        Context includes:
        - traces_json: Recent execution traces (stage outcomes, latencies, parse errors)
        - diagnostics_json (if present): Structured diagnostic codes computed by the
          same analyzer `armature improve` uses. Each entry has a `code`
          (stage_failed, output_invalid, low_confidence, high_escalation,
          postcondition_failed, uncalled_tools), a `stage_id`, `details`, and a
          `causal_attribution` identifying the root-cause category. When this is present
          and non-empty, prefer it as the primary signal — do not re-derive failure
          patterns from raw traces_json except for latency (latency_ms > 2000), which
          the codes do not cover.
        - improvement_history_json (if present): Unified prior history from BOTH
          `armature improve` and `armature optimize`, each entry tagged with `source`.
          `source: improve` records carry `verified_fixes` (fixes that worked — do NOT
          re-propose these), `missed_predictions` (fixes predicted but still failing —
          prioritize these as confirmed-still-broken targets), `unexpected_regressions`
          (stages that regressed after a change — avoid touching them), plus `applied`,
          `hqs_before`, `drift_score`, `triggered_by_drift`, `escalated_oscillation`,
          `latency_risk`. `source: optimize` records carry `accepted`, `score`,
          `proposed_diff`, `rationale` (A/B-tested diffs — do NOT re-propose rejected
          ones, build on accepted ones). Use this to avoid redoing either engine's
          verified/rejected work and to target unresolved failures.

        Identify the single most impactful failure pattern NOT already addressed by a
        prior accepted proposal. Focus on: JSON parse errors (_parse_error in outputs),
        high latency stages (latency_ms > 2000), repeated validation failures, stages with
        success=false.

        If proposal_history_json shows a prior accepted diff for the same failure type,
        look for the next most impactful issue instead.

        Return structured analysis.
    output_mode: guided_json
    output_schema:
      type: object
      required: [top_failure, failure_count, affected_stage]
      properties:
        top_failure:
          type: string
          description: "Short description of the most common failure pattern"
        failure_count:
          type: integer
          description: "Number of traces showing this pattern"
        affected_stage:
          type: string
          description: "Stage ID most affected"

  - id: propose_fix
    depends_on: [analyze_traces]
    role:
      name: spec_optimizer
      type: orchestrator
      model_tier: frontier
      description: |
        Based on the failure analysis in context (top_failure, failure_count, affected_stage),
        propose a minimal change to the workflow YAML spec that directly addresses the failure.
        Output as a unified diff (--- original\n+++ proposed). Be conservative — change one
        thing at a time. If the failure is JSON parse errors, suggest adding output_mode: guided_json
        and an appropriate output_schema to the affected stage.
        If improvement_history_json is present, do NOT re-propose a change whose target
        appears in any `source: improve` record's `verified_fixes` or any `source:
        optimize` record that was rejected — those already worked or already failed.
        Prefer targets in `source: improve` records' `missed_predictions` (confirmed
        still broken).
    output_mode: guided_json
    output_schema:
      type: object
      required: [proposed_diff, rationale, confidence]
      properties:
        proposed_diff:
          type: string
          description: "Unified diff format change to the YAML spec"
        rationale:
          type: string
          description: "Why this change addresses the failure"
        confidence:
          type: number
          description: "0.0-1.0 confidence the change will help"

  - id: evaluate_proposal
    depends_on: [propose_fix]
    role:
      name: spec_judge
      type: judge
      model_tier: frontier
      description: |
        Evaluate the proposed spec diff (proposed_diff, rationale, confidence) in context.
        Will this change address the failure without breaking existing functionality?
        Consider: Does the diff make sense given the failure? Is it minimal? Could it introduce
        regressions? Score the proposal objectively.
    output_mode: guided_json
    output_schema:
      type: object
      required: [accept, score, feedback]
      properties:
        accept:
          type: boolean
          description: "True if the proposal should be accepted"
        score:
          type: number
          description: "Quality score 0.0-1.0"
        feedback:
          type: string
          description: "Reasoning for accept/reject decision"
