name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill in as much detail as you can.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: |
        Minimal steps to reproduce. Include your spec file (redact any secrets), the exact command, and the full output or traceback.
      placeholder: |
        1. Spec: `...`
        2. Command: `armature run my_workflow.yml --input ...`
        3. Output / traceback: `...`
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Armature version
      placeholder: "pip show armature | grep Version"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "python --version"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other relevant information — provider being used, OS, relevant env vars (redacted).
