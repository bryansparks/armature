name: campaign-research-brief-memory-nav
version: "1.0"
description: "Nav-enabled (memory pyramid) research-brief workflow for the H4 3-way cold/warm/nav test. Adds active navigation tools (memory.search_records / read_track / read_profile) and a curator to the warm spec, so the researcher pulls only the prior sub-problems it needs via tool calls instead of receiving a passive _memory dump."
mission: >
  You are a research analyst covering a BROAD, multi-aspect technical topic across
  repeated runs. The topic spans many distinct sub-problems; no single briefing
  can cover them all. Each run, produce a briefing that covers as many DISTINCT
  relevant sub-problems as you can, each stated correctly in one grounded sentence.
  When prior memory is available, use the memory navigation tools to pull only the
  sub-problems already covered, then make your briefing ADDITIVE: cover NEW
  sub-problems not already addressed, referencing and extending what was
  established — do not repeat points already covered. Do not fabricate; omit a
  sub-problem rather than invent one. The memory pyramid carries your accumulated
  coverage forward across runs (tracks + profiles + extracted knowledge), so
  nav-enabled runs should reach broader coverage than warm (passive-injection)
  runs, which in turn should beat cold runs.

# ── Model configuration (borrowed from campaign_research_brief.yml / armature-research)
model_tiers:
  small:
    provider: openrouter
    model: qwen/qwen3.6-27b
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.2
    max_tokens: 2048

  medium:
    provider: openrouter
    model: moonshotai/kimi-k2.6
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.2
    max_tokens: 8192

  large:
    provider: openrouter
    model: z-ai/glm-5.2
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.3
    max_tokens: 16384

role_type_defaults:
  worker: small
  orchestrator: medium
  researcher: medium
  judge: large

contracts:
  inputs:
    - name: topic          # required — the broad research subject
  max_iterations: 40
  max_llm_calls: 200
  timeout_hours: 1.0

# ── Memory pyramid (Phase 3). `fresh` is toggled per run by the campaign's
# memory_cold_warm lever: true = cold (ignore prior memories this run, but still
# capture), false = warm/nav (inject prior knowledge + allow navigation). The
# researcher declares read-only memory.* tools, so the engine suppresses the
# full _knowledge dump for that stage and instead exposes a _memory_index
# navigation ToC. The researcher pulls only the prior sub-problems it needs via
# tool calls. A dedicated `curator` post_run stage (runs after the main DAG, so
# it sees this run's reconciled L1 records) writes L2 tracks and the L3 team
# profile so subsequent runs can navigate to this run's coverage.
# extract_knowledge turns on L1 knowledge-record extraction.
memory:
  enabled: true
  fresh: false             # default warm/nav; the lever flips this per run
  inject_as: _memory
  # Share the warm spec's L0 memory DB so the nav arm navigates the compare
  # phase's accumulated captures (the NapMem scenario: navigation over a large
  # accumulated memory vs. passive injection of 10 facts). Without this, the nav
  # spec's workflow name (`-nav`) would get its own empty DB and the nav arm
  # could never beat warm on coverage. `~` expands against the sandbox HOME, so
  # this resolves to <sandbox>/.armature/memory/campaign-research-brief-memory.db
  # — the same path the warm spec defaults to (engine.py memory DB path =
  # ~/.armature/memory/<spec.name>.db). The knowledge DB is derived as
  # <mem_path>_knowledge.db, so nav's extractor (extract_knowledge: true) also
  # shares/reconciles into the warm spec's knowledge DB.
  db: ~/.armature/memory/campaign-research-brief-memory.db
  capture:
    - stage: researcher
      key: content
      max_entries: 8
  extract_knowledge: true
  inject_knowledge_as: _knowledge
  navigation_tools: true
  curator_stage: curator   # dedicated post_run stage (see below) — NOT researcher
  track_budget: 20
  profile_budget: 2000
  track_char_budget: 2000
  track_refresh_threshold: 10
  profile_refresh_threshold: 3

stages:
  - id: researcher
    role:
      name: Researcher
      type: researcher
      tools:
        - memory.search_records
        - memory.read_track
        - memory.read_profile
      description: |
        Research the following BROAD topic and produce a briefing that covers
        as many DISTINCT relevant sub-problems as you can identify. BREADTH is
        the goal: cover more distinct sub-problems (each correctly stated)
        rather than going deep on a few. For each, give one correct, grounded
        sentence. Do not fabricate.
        {% if _memory_index is defined and _memory_index %}
        A navigation index of accumulated memory is available. Use the
        memory.read_track / memory.search_records tools to pull only the prior
        sub-problems already covered, then make this briefing ADDITIVE: cover
        NEW sub-problems NOT already addressed. Index:
        {{ _memory_index }}
        {% else %}
        No prior memory index is available — produce a fresh briefing from
        scratch, covering as many distinct sub-problems as you can identify.
        {% endif %}
        Topic: {{ topic }}
    output_mode: text
    depends_on: []

  - id: judge
    role:
      name: Judge
      type: judge
      description: |
        Assess the researcher's briefing on a BROAD, multi-aspect topic. The
        decisive quality dimension is COVERAGE BREADTH: how many DISTINCT,
        relevant sub-problems of the topic are each stated correctly and
        grounded, with no fabrication.

        Score `confidence` as the breadth of distinct, correct, non-repetitive,
        non-fabricated sub-problems covered, on this scale:
          - 1-2 distinct points  -> confidence ~0.15-0.25
          - 3-4                  -> ~0.40-0.55
          - 5-6                  -> ~0.65-0.80
          - 7-8+                 -> ~0.85-1.00
        Subtract ~0.15 for any fabricated or clearly incorrect claim, and ~0.05
        per point that merely repeats an obvious surface fact with no real
        content. A briefing covering the same few obvious points scores LOW; one
        covering many distinct sub-problems scores HIGH. Do NOT give high
        confidence to a briefing merely for being well-written — reward BREADTH
        of correct coverage. `accept` is true iff confidence >= 0.5 and no
        fabricated claim is present. List each defect / fabricated / incorrect
        claim in `issues` (one per line); if there are none, return an empty
        issues list.
        Briefing:
        {{ researcher.content }}
        Topic: {{ topic }}
    output_mode: guided_json
    output_schema:
      type: object
      required: [accept, confidence, issues]
      properties:
        accept: {type: boolean}
        confidence: {type: number, minimum: 0.0, maximum: 1.0}
        issues: {type: array, items: {type: string}}
    on_fail:
      loop: {stage: judge, max: 2}
    depends_on: [researcher]

  - id: curator
    post_run: true
    depends_on: []
    role:
      name: Curator
      type: judge
      tools:
        - memory.search_records
        - memory.get_records
        - memory.write_track
        - memory.write_profile
      description: |
        Curate L2 topic tracks and the L3 team profile from this run's
        reconciled L1 knowledge records. Call memory.search_records to survey
        what was established this run, then memory.write_track for each
        distinct sub-problem covered (up to 20 tracks, summary ≤2000 chars,
        citing record ids via evidence_links), and memory.write_profile once
        to capture stable team attributes. If _memory_index_refresh_hint
        indicates little new material, keep writes minimal.
    output_mode: text
    signature:
      input:
        topic: Research topic
        _memory_index: Knowledge index summary
        _memory_index_refresh_hint: Refresh hint