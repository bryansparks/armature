name: campaign-research-brief-memory
version: "1.0"
description: "Memory-enabled research-brief workflow for the H4 cold-vs-warm test. Carries the researcher's prior briefings forward via MemoryStore; warm runs build on them, cold runs (memory.fresh: true) ignore them. Same tiers as campaign_research_brief."
mission: >
  You are a concise research analyst monitoring a fixed topic across repeated
  runs. Each run, produce a short, accurate briefing. When prior briefings are
  provided, build on them — refine the points, add new ones not already
  covered, and explicitly ground new claims in what was established before. Do
  not fabricate; reason carefully and flag uncertainty. Memory carries your
  accumulated understanding forward across runs.

# ── Model configuration (borrowed from campaign_research_brief.yml / armature-research)
model_tiers:
  small:
    provider: openrouter
    model: qwen/qwen3.6-27b
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.2
    max_tokens: 2048

  medium:
    provider: openrouter
    model: moonshotai/kimi-k2.6
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.2
    max_tokens: 8192

  large:
    provider: openrouter
    model: z-ai/glm-5.2
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.3
    max_tokens: 16384

role_type_defaults:
  worker: small
  orchestrator: medium
  researcher: medium
  judge: large

contracts:
  inputs:
    - name: topic          # required — the (fixed) research subject
  max_iterations: 40
  max_llm_calls: 200
  timeout_hours: 1.0

# ── Cross-run memory (MemoryStore, Layer 3). `fresh` is toggled per phase by
# the campaign's memory_cold_warm lever: true = cold (ignore prior memories
# this run, but still capture), false = warm (inject prior briefings). Capture
# the researcher's text output under `content` (text mode stores {content: ...})
# so the next warm run can build on it. No knowledge extraction (zero extra LLM).
memory:
  enabled: true
  fresh: false            # default warm; the lever flips this per phase
  inject_as: _memory
  capture:
    - stage: researcher
      key: content
      max_entries: 8

stages:
  - id: researcher
    role:
      name: Researcher
      type: researcher
      description: |
        Research the following topic and produce a concise, accurate briefing:
        3-5 key points, each with a one-sentence justification. Do not fabricate.
        If the topic is advanced, reason step by step and flag any uncertainty.
        {% if _memory is defined and _memory %}
        Prior briefings from earlier runs (newest first). Build on these —
        refine the existing points, add NEW points not already covered, and
        explicitly ground new claims in what was established before. Do not
        merely repeat what is already there.
        {{ _memory.researcher.content }}
        {% else %}
        No prior briefings are available — produce a fresh briefing from scratch.
        {% endif %}
        Topic: {{ topic }}
    output_mode: text
    depends_on: []

  - id: judge
    role:
      name: Judge
      type: judge
      description: |
        Assess the researcher's briefing for accuracy, depth, and correctness.
        A stronger briefing covers more distinct, relevant points, each with a
        clear, correct justification and no fabrication. Reward grounded,
        well-justified coverage; penalize vague, unsupported, or fabricated
        claims. Return a structured verdict.
        Briefing:
        {{ researcher.content }}
        Topic: {{ topic }}
    output_mode: guided_json
    output_schema:
      type: object
      required: [accept, confidence, issues]
      properties:
        accept: {type: boolean}
        confidence: {type: number, minimum: 0.0, maximum: 1.0}
        issues: {type: array, items: {type: string}}
    on_fail:
      loop: {stage: judge, max: 2}
    depends_on: [researcher]