<style>
/* ── Armature branded header ─────────────────────────────────────── */
.armature-header {
  background: linear-gradient(160deg, #0d1117 0%, #131921 60%, #0d1117 100%);
  border-bottom: 1px solid #21262d;
  padding: 2rem 2rem 1.75rem;
  margin: -2rem -2rem 2.5rem;
  position: relative;
  overflow: hidden;
}

/* subtle ambient glow behind DAG */
.armature-header::before {
  content: '';
  position: absolute;
  left: -40px; top: 50%;
  transform: translateY(-50%);
  width: 340px; height: 220px;
  background: radial-gradient(ellipse, rgba(74,222,128,.07) 0%, transparent 70%);
  pointer-events: none;
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 3rem;
  position: relative;
  z-index: 1;
}

/* ── DAG ─────────────────────────────────────────────────────────── */
.dag-wrap {
  flex-shrink: 0;
}

.dag-svg {
  display: block;
  width: 200px;
  height: 148px;
  overflow: visible;
}

/* role-type colours */
:root {
  --c-researcher : #4ade80;
  --c-worker     : #60a5fa;
  --c-judge      : #c084fc;
  --c-idle       : #2a2d3e;
  --c-edge       : #30363d;
}

/* node base */
.dag-node {
  fill: #0d1117;
  stroke: var(--c-idle);
  stroke-width: 1.5;
  transition: stroke .3s, fill .3s;
}

/* active pulse per role type */
@keyframes pulse-researcher {
  0%,100% { fill:#0d1117; stroke:var(--c-idle);       filter:none; }
  40%,60% { fill:rgba(74,222,128,.13); stroke:var(--c-researcher); filter:drop-shadow(0 0 7px rgba(74,222,128,.55)); }
}
@keyframes pulse-worker {
  0%,100% { fill:#0d1117; stroke:var(--c-idle);       filter:none; }
  40%,60% { fill:rgba(96,165,250,.13); stroke:var(--c-worker);     filter:drop-shadow(0 0 7px rgba(96,165,250,.55)); }
}
@keyframes pulse-judge {
  0%,100% { fill:#0d1117; stroke:var(--c-idle);       filter:none; }
  40%,60% { fill:rgba(192,132,252,.13); stroke:var(--c-judge);    filter:drop-shadow(0 0 7px rgba(192,132,252,.55)); }
}

/* timing: each node activates in topological order within a 5s cycle */
.n-intake   { animation: pulse-researcher 5s ease-in-out infinite; animation-delay:0s; }
.n-analyst  { animation: pulse-worker     5s ease-in-out infinite; animation-delay:.7s; }
.n-writer   { animation: pulse-worker     5s ease-in-out infinite; animation-delay:.7s; }
.n-judge    { animation: pulse-judge      5s ease-in-out infinite; animation-delay:1.5s; }
.n-synth    { animation: pulse-researcher 5s ease-in-out infinite; animation-delay:2.2s; }

/* edge flow */
@keyframes edge-flow {
  0%   { stroke-dashoffset:20; opacity:.18; }
  50%  { opacity:.55; }
  100% { stroke-dashoffset:0;  opacity:.18; }
}

.dag-edge {
  stroke: var(--c-edge);
  stroke-width: 1.4;
  fill: none;
  stroke-dasharray: 4 3;
  animation: edge-flow 5s ease-in-out infinite;
}
.e-ab { animation-delay:.3s; }
.e-ac { animation-delay:.3s; }
.e-bd { animation-delay:1.1s; }
.e-cd { animation-delay:1.1s; }
.e-de { animation-delay:1.9s; }

/* node role labels */
.node-label {
  font: 600 6.5px 'JetBrains Mono','Fira Code',monospace;
  fill: #4b5563;
  letter-spacing:.03em;
  pointer-events: none;
  user-select: none;
}

/* ── Brand block ─────────────────────────────────────────────────── */
.brand { flex: 1; }

.brand-wordmark {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 2.6rem;
  font-weight: 800;
  letter-spacing: .16em;
  color: #f0f6fc;
  line-height: 1;
  margin-bottom: .55rem;
}

.brand-divider {
  width: 2.5rem;
  height: 2px;
  background: linear-gradient(90deg, #4ade80, transparent);
  margin-bottom: .65rem;
  border-radius: 2px;
}

.brand-tagline {
  font-size: .95rem;
  color: #8b949e;
  margin-bottom: 1rem;
  letter-spacing: .02em;
}

.brand-chips {
  display: flex;
  gap: .45rem;
  flex-wrap: wrap;
}

.chip {
  font: 500 .72rem 'JetBrains Mono','Fira Code',monospace;
  padding: .18rem .55rem;
  border-radius: 999px;
  letter-spacing: .02em;
}
.chip-version {
  background: rgba(74,222,128,.1);
  border: 1px solid rgba(74,222,128,.28);
  color: #4ade80;
}
.chip-meta {
  background: #161b22;
  border: 1px solid #30363d;
  color: #6e7681;
}

/* role legend */
.role-legend {
  display: flex;
  gap: 1rem;
  margin-top: .9rem;
  align-items: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: .35rem;
  font: .68rem 'JetBrains Mono','Fira Code',monospace;
  color: #6e7681;
}
.legend-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  border: 1.5px solid;
  flex-shrink: 0;
}
.dot-researcher { border-color: var(--c-researcher); background: rgba(74,222,128,.15); }
.dot-worker     { border-color: var(--c-worker);     background: rgba(96,165,250,.15); }
.dot-judge      { border-color: var(--c-judge);      background: rgba(192,132,252,.15); }
</style>

<header class="armature-header">
  <div class="header-inner">

    <!-- ── Animated DAG ─────────────────────────────────────────── -->
    <div class="dag-wrap">
      <svg class="dag-svg" viewBox="-10 0 220 148" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr" markerWidth="5" markerHeight="5" refX="4.5" refY="2.5" orient="auto">
            <path d="M0,0 L0,5 L5,2.5z" fill="#30363d"/>
          </marker>
        </defs>

        <!-- Edges (drawn below nodes) -->
        <!-- intake → analyst -->
        <line class="dag-edge e-ab" x1="74"  y1="30" x2="44"  y2="58" marker-end="url(#arr)"/>
        <!-- intake → writer -->
        <line class="dag-edge e-ac" x1="106" y1="30" x2="136" y2="58" marker-end="url(#arr)"/>
        <!-- analyst → judge -->
        <line class="dag-edge e-bd" x1="44"  y1="78" x2="74"  y2="104" marker-end="url(#arr)"/>
        <!-- writer → judge -->
        <line class="dag-edge e-cd" x1="136" y1="78" x2="106" y2="104" marker-end="url(#arr)"/>
        <!-- judge → synthesizer -->
        <line class="dag-edge e-de" x1="90"  y1="124" x2="90" y2="136" marker-end="url(#arr)"/>

        <!-- ── Nodes ── -->

        <!-- intake (researcher) -->
        <circle class="dag-node n-intake" cx="90" cy="18" r="14"/>
        <text class="node-label" x="90" y="21.5" text-anchor="middle">intake</text>
        <text class="node-label" x="90" y="-1.5" text-anchor="middle" style="fill:#4ade80;opacity:.55">researcher</text>

        <!-- analyst (worker) -->
        <circle class="dag-node n-analyst" cx="35" cy="68" r="14"/>
        <text class="node-label" x="35" y="71.5" text-anchor="middle">analyst</text>
        <text class="node-label" x="10" y="68" text-anchor="end" style="fill:#60a5fa;opacity:.55">worker</text>

        <!-- writer (worker) -->
        <circle class="dag-node n-writer" cx="145" cy="68" r="14"/>
        <text class="node-label" x="145" y="71.5" text-anchor="middle">writer</text>
        <text class="node-label" x="170" y="68" text-anchor="start" style="fill:#60a5fa;opacity:.55">worker</text>

        <!-- judge -->
        <circle class="dag-node n-judge" cx="90" cy="114" r="14"/>
        <text class="node-label" x="90" y="117.5" text-anchor="middle">judge</text>
        <text class="node-label" x="110" y="117" text-anchor="start" style="fill:#c084fc;opacity:.55">judge</text>

        <!-- synthesizer (researcher) -->
        <circle class="dag-node n-synth" cx="90" cy="142" r="8"/>
        <text class="node-label" x="90" y="144.5" text-anchor="middle" style="font-size:5.5px">synth</text>
      </svg>
    </div>

    <!-- ── Brand ─────────────────────────────────────────────────── -->
    <div class="brand">
      <div class="brand-wordmark">ARMATURE</div>
      <div class="brand-divider"></div>
      <div class="brand-tagline">Multi-Agent Workflow Engine</div>
      <div class="brand-chips">
        <span class="chip chip-version">v0.1.0</span>
        <span class="chip chip-meta">Python 3.11+</span>
        <span class="chip chip-meta">MIT License</span>
        <span class="chip chip-meta">litellm · async</span>
      </div>
      <div class="role-legend">
        <div class="legend-item">
          <div class="legend-dot dot-researcher"></div>researcher
        </div>
        <div class="legend-item">
          <div class="legend-dot dot-worker"></div>worker
        </div>
        <div class="legend-item">
          <div class="legend-dot dot-judge"></div>judge
        </div>
      </div>
    </div>

  </div>
</header>
