name: work-echo
version: "1.0"
description: >
  Work-transport fixture — one script adapter stage that renders the
  injected work_unit record into its stdout. mission_source opts the spec
  into the runner's step-4.7 injection. No LLM, no secrets, no closure
  (a closure stage must be guided_json — covered at unit level instead).

mission_source: work_unit

adapters:
  echoer:
    name: echoer
    type: script
    # An ungoverned run, with no work_unit in context, prints 'none' and still completes.
    cmd: "python3 -c 'import json, os; c = json.loads(os.environ[\"ARMATURE_CONTEXT\"]); print(\"title=\" + c.get(\"work_unit\", {}).get(\"title\", \"none\") + \" mission=\" + c.get(\"work_unit\", {}).get(\"mission\", \"none\"), end=\"\")'"

stages:
  - id: echoer
    adapter: echoer
    depends_on: []