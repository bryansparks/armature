name: child-workflow
version: "1.0"
description: Simple child workflow for subagent tests

adapters:
  greet:
    name: greet
    type: script
    cmd: "python3 -c 'import json, os; c = json.loads(os.environ[\"ARMATURE_CONTEXT\"]); print(\"child says:\", c.get(\"greeting\", \"\"))'"

stages:
  - id: respond
    adapter: greet
