name: isolated-child
version: "1.0"
description: Child workflow for context isolation tests

adapters:
  reveal:
    name: reveal
    type: script
    cmd: "python3 -c 'import json, os; c = json.loads(os.environ[\"ARMATURE_CONTEXT\"]); print(\"greeting=\" + str(c.get(\"greeting\", \"\")) + \" secret=\" + str(c.get(\"secret\", \"\")))'"

stages:
  - id: reveal
    adapter: reveal
