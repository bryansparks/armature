[build-system]
requires = ["hatchling<1.24"]
build-backend = "hatchling.build"

[project]
name = "armature-agents"
version = "0.3.4"
description = "Agent execution harness — wraps LLMs in structured, inspectable workflow specs"
readme = "README.md"
authors = [
    {name = "Bryan Sparks", email = "bryan@elftech.ai"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "litellm>=1.40",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
    "croniter>=2.0",
]

[project.urls]
Repository = "https://github.com/bryansparks/armature"
Documentation = "https://github.com/bryansparks/armature/blob/main/docs/USER-GUIDE.md"
Changelog = "https://github.com/bryansparks/armature/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "armature/",
    "templates/",
    "examples/",
    "tests/",
    "docs/*.md",
    "README.md",
    "LICENSE",
    "run_tests.sh",
]

[project.scripts]
armature = "armature.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "opentelemetry-sdk>=1.24",
    "ruff>=0.4",
]
service = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
wizard = [
    "questionary>=2.0",
]
embeddings = [
    "sentence-transformers>=2.7",
]
telemetry = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
langfuse = [
    "langfuse>=3.0",
]
langsmith = [
    "langsmith>=0.2",
]
mcp = [
    "mcp>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["armature"]
