[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "armature"
version = "0.1.0"
description = "Agent execution harness — wraps LLMs in structured, inspectable workflow specs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "litellm>=1.40",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
armature = "armature.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "opentelemetry-sdk>=1.24",
]
service = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
wizard = [
    "questionary>=2.0",
    "rich>=13.0",
]
embeddings = [
    "sentence-transformers>=2.7",
]
telemetry = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
]
langfuse = [
    "langfuse>=3.0",
]
langsmith = [
    "langsmith>=0.2",
]
mcp = [
    "mcp>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["armature"]
