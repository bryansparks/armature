# Standard deliberation pattern: specialist analysts → challenger → synthesizer.
# This is the "manual" version of the pattern — use six_thinking_hats.yml
# for the full structured methodology.
#
# Demonstrates: multi-agent deliberation, sequential R1 specialists,
#               mandatory challenger role, synthesizer with JSON output,
#               confidence-gated human escalation via gate stage.
#
# Usage:
#   armature run examples/03_deliberation_standard.yml \
#     --input objective="Should we migrate our auth system to OAuth 2.0?" \
#     --input documents="Current auth system uses session cookies..."
#
# Python:
#   harness = Harness.from_spec("examples/03_deliberation_standard.yml")
#   result = await harness.run({
#       "objective": "Should we migrate our auth system to OAuth 2.0?",
#       "documents": "Current auth system details...",
#   })
#   synthesis = result["synthesizer"]
#   print(synthesis["decision"])
#   print(f"Confidence: {synthesis['confidence']}")

name: standard_deliberation
version: "1.0"
description: Three-round deliberation — specialists, challenger, synthesizer

model_tiers:
  # SLM tier — runs the 3 specialist analysts and the challenger (4 of 5 stages)
  small:
    provider: openrouter
    model: qwen/qwen3.6-27b
  # Frontier tier — reserved for the synthesizer: sole decision authority
  frontier:
    provider: openrouter
    model: google/gemini-2.5-flash

stages:

  # ----------------------------------------------------------------
  # R1 — Specialist analysis (sequential so each sees prior outputs)
  # ----------------------------------------------------------------

  - id: analyst
    role:
      name: Analyst
      type: researcher
      model_tier: small
      description: |
        You are an objective analyst deliberating on the following:

        OBJECTIVE: {{ objective }}

        Analyze the available evidence and provide your assessment.
        You MUST end with a position declaration on its own line:
        My position: PROCEED | BLOCK | MODIFY

        Structure:
        ## Key Findings
        [Evidence-based observations]

        ## Assessment
        [Your domain analysis]

        ## Risks and Gaps
        [Uncertainties and unknowns]

        My position: [PROCEED | BLOCK | MODIFY]
    output_mode: text
    depends_on: []

  - id: strategist
    role:
      name: Strategist
      type: researcher
      model_tier: small
      description: |
        You are a strategic thinker deliberating on the following:

        OBJECTIVE: {{ objective }}

        Evaluate the long-term strategic implications.
        You have access to the analyst's findings in context.
        You MUST end with a position declaration on its own line:
        My position: PROCEED | BLOCK | MODIFY

        Structure:
        ## Strategic Alignment
        [Does this serve long-term goals?]

        ## Opportunity Costs
        [What alternatives are foregone?]

        ## Long-Term Risks
        [Strategic risks over 1-3 year horizon]

        My position: [PROCEED | BLOCK | MODIFY]
    output_mode: text
    depends_on: [analyst]

  - id: risk_assessor
    role:
      name: Risk Assessor
      type: researcher
      model_tier: small
      description: |
        You are a risk specialist deliberating on the following:

        OBJECTIVE: {{ objective }}

        Identify and categorize risks with mitigations.
        You have access to the analyst and strategist findings in context.
        You MUST end with a position declaration on its own line:
        My position: PROCEED | BLOCK | MODIFY

        Structure:
        ## Top Risks
        [Each risk: likelihood (H/M/L) × impact (H/M/L), mitigation]

        ## Escalation Flags
        [Any risks that require immediate human attention]

        ## Unmitigatable Risks
        [Risks with no good mitigation path]

        My position: [PROCEED | BLOCK | MODIFY]
    output_mode: text
    depends_on: [strategist]

  # ----------------------------------------------------------------
  # R2 — Challenger (sees all R1 outputs)
  # ----------------------------------------------------------------

  - id: challenger
    role:
      name: Challenger
      type: researcher
      model_tier: small
      description: |
        You are the Challenger. Your role is constructive skepticism.
        You have access to all specialist analyses in context.

        OBJECTIVE: {{ objective }}

        Your job: attack the weakest arguments. Prevent groupthink.
        Do NOT challenge well-supported, evidence-backed positions.
        Focus on: unsupported assumptions, overlooked risks, logical gaps.

        Structure:
        ## Per-Specialist Challenges
        [For each specialist: Claim / Challenge / Severity (H/M/L)]

        ## Open Questions
        [Questions the specialists did not answer]

        ## Strongest Position
        [Which specialist made the most evidence-grounded case and why]

        ## Underweighted Risks
        [Risks the specialists minimized that deserve more weight]
    output_mode: text
    depends_on: [analyst, strategist, risk_assessor]

  # ----------------------------------------------------------------
  # R3 — Synthesizer (sees all R1 + R2, sole decision authority)
  # ----------------------------------------------------------------

  - id: synthesizer
    role:
      name: Synthesizer
      type: judge
      model_tier: frontier
      description: |
        You are the Synthesizer. You have read the full deliberation in context.
        You are the sole decision authority.

        OBJECTIVE: {{ objective }}

        PROTOCOL:
        1. Note each specialist's position (PROCEED/BLOCK/MODIFY) and resolve conflicts
        2. Accept, partially accept, or reject each Challenger concern with reasoning
        3. Synthesize the evidence into a final decision
        4. Record minority positions honestly — do not paper over disagreements
        5. Calibrate confidence honestly: reduce for unresolved questions or split positions

        You MUST end with a JSON block in this exact format:
        ```json
        {
          "decision": "recommendation in 1-3 sentences",
          "reasoning": "explanation citing specific specialist perspectives",
          "confidence": 0.0,
          "positions": {"analyst": "PROCEED", "strategist": "MODIFY", "risk_assessor": "BLOCK"},
          "key_evidence": ["specific point 1", "specific point 2"],
          "dissenting_opinions": [
            {"agent": "role name", "concern": "concern text", "why_not_blocking": "explanation"}
          ],
          "risk_factors": ["unresolved risk"],
          "open_questions": ["unanswered question"],
          "concerns_addressed": [
            {"concern": "challenger concern", "status": "accepted|partial|rejected", "resolution": "how"}
          ]
        }
        ```
    output_mode: guided_json
    output_schema:
      type: object
      required: [decision, reasoning, confidence]
      properties:
        decision:
          type: string
        reasoning:
          type: string
        confidence:
          type: number
          minimum: 0.0
          maximum: 1.0
        positions:
          type: object
        key_evidence:
          type: array
          items:
            type: string
        dissenting_opinions:
          type: array
          items:
            type: object
        risk_factors:
          type: array
          items:
            type: string
        open_questions:
          type: array
          items:
            type: string
        concerns_addressed:
          type: array
          items:
            type: object
    depends_on: [analyst, strategist, risk_assessor, challenger]

  # ----------------------------------------------------------------
  # Human escalation gate — fires when confidence is low
  # In application code: check synthesizer.confidence and conditionally
  # route to this gate. Shown here as an unconditional review step.
  # ----------------------------------------------------------------

  - id: human_review
    gate: human
    present: |
      ============================================================
      DELIBERATION COMPLETE — SYNTHESIZER DECISION
      ============================================================

      Decision: {{ synthesizer.decision }}
      Confidence: {{ synthesizer.confidence }}

      Reasoning: {{ synthesizer.reasoning }}

      Risk Factors:
      {% for r in synthesizer.risk_factors %}- {{ r }}
      {% endfor %}
      Open Questions:
      {% for q in synthesizer.open_questions %}- {{ q }}
      {% endfor %}
      ============================================================
      Do you approve this recommendation?
    depends_on: [synthesizer]

# ── Expected output (illustrative — actual content varies by model/input) ─
#
#   armature run examples/03_deliberation_standard.yml \
#     --input objective="Should we migrate our auth system to OAuth 2.0?"
#
#   [analyst]      → text: position MODIFY (evidence for migration is strong but
#                           implementation risk is underestimated)
#   [strategist]   → text: position PROCEED (OAuth 2.0 is the industry standard;
#                           delay creates growing technical debt)
#   [risk_assessor]→ text: position MODIFY (session management migration without
#                           rollback plan is a HIGH risk)
#   [challenger]   → text: challenges analyst on "underestimated risk" claim —
#                           asks for specific failure scenario evidence
#
#   [synthesizer] → JSON:
#     {
#       "decision":    "Proceed with migration, but require a phased rollout plan
#                        with per-service rollback capability before kickoff.",
#       "reasoning":   "Two of three specialists support migration; the MODIFY
#                        positions converge on implementation risk, not the goal
#                        itself. Challenger's pushback on the analyst was partially
#                        accepted — rollback plan addresses the core concern.",
#       "confidence":  0.78,
#       "positions":   {"analyst": "MODIFY", "strategist": "PROCEED",
#                       "risk_assessor": "MODIFY"},
#       "key_evidence": ["OAuth 2.0 is industry standard reducing future maintenance",
#                         "Session migration without rollback flagged by 2 of 3 agents"],
#       "risk_factors": ["No rollback plan currently exists for session store migration"]
#     }
#
#   HUMAN GATE: Presents decision (confidence 0.78) for approval.
#   Done in ~22s
