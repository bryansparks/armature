name: topic-researcher
version: "1.0"
description: >
  A two-stage LLM research pipeline (researcher -> writer) packaged for
  portable execution. Produces a 3-paragraph briefing artifact. Requires an
  Anthropic API key at run time (injected from the owner's --profile, never
  bundled).

model_tiers:
  small:
    provider: anthropic
    model: claude-haiku-4-5-20251001
    api_key_env: ANTHROPIC_API_KEY

role_type_defaults:
  worker: small
  researcher: small

contracts:
  inputs:
    - name: topic

stages:
  - id: researcher
    role:
      name: Researcher
      type: researcher
      description: |
        Research the following topic thoroughly.
        Identify key findings, data points, and open questions.
        Topic: {{ topic }}
    output_mode: text
    depends_on: []

  - id: writer
    role:
      name: Writer
      type: worker
      description: |
        Turn the researcher's notes into a crisp 3-paragraph briefing.
        Preserve all concrete facts. Eliminate repetition.
        Notes: {{ researcher.content }}
    output_mode: text
    depends_on: [researcher]