name: agent-reference-demo
version: "1.0"
description: >
  Demonstrates the agent_library feature: stages can reference pre-built agent
  bundles instead of inlining a role. The bundle's role and skills are merged
  into the spec at load time.

model_tiers:
  small:
    provider: openrouter
    model: qwen/qwen3-8b
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.2
    max_tokens: 1024

role_type_defaults:
  worker: small

contracts:
  inputs:
    - name: topic

# Declare the agent bundles available in this workflow.
# Each key is the agent identifier that stages reference via the `agent:` field.
# The path is resolved relative to this spec file.
agent_library:
  echo:
    path: agents/echo/agent.yaml

stages:
  - id: greeter
    agent: echo          # resolved to the role defined in agents/echo/agent.yaml
    output_mode: text
    depends_on: []
